services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      ConnectionStrings__umbracoDbDSN: Server=sqlserver;Database=${UMBRACO_DB_NAME:-UmbracoDb};User Id=sa;Password=${SQL_SA_PASSWORD:?Set SQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=True;
      ConnectionStrings__umbracoDbDSN_ProviderName: Microsoft.Data.SqlClient
      Umbraco__CMS__Global__InstallMissingDatabase: "true"
      Umbraco__CMS__Global__UseHttps: "true"
      Umbraco__CMS__Hosting__SiteName: ${UMBRACO_SITE_NAME:?Set UMBRACO_SITE_NAME}
      Umbraco__CMS__Unattended__InstallUnattended: "true"
      Umbraco__CMS__Unattended__PackageMigrationsUnattended: "true"
      Umbraco__CMS__Unattended__UpgradeUnattended: "true"
      Umbraco__CMS__Unattended__UnattendedUserName: ${UMBRACO_ADMIN_NAME:?Set UMBRACO_ADMIN_NAME}
      Umbraco__CMS__Unattended__UnattendedUserEmail: ${UMBRACO_ADMIN_EMAIL:?Set UMBRACO_ADMIN_EMAIL}
      Umbraco__CMS__Unattended__UnattendedUserPassword: ${UMBRACO_ADMIN_PASSWORD:?Set UMBRACO_ADMIN_PASSWORD}
      Umbraco__CMS__Unattended__UnattendedTelemetryLevel: ${UMBRACO_TELEMETRY_LEVEL:-Basic}
    depends_on:
      sqlserver:
        condition: service_healthy
    expose:
      - "8080"
    restart: unless-stopped
    volumes:
      - umbraco_media:/app/wwwroot/media

  sqlserver:
    build:
      context: ./database
    environment:
      ACCEPT_EULA: Y
      SQL_SA_PASSWORD: ${SQL_SA_PASSWORD:?Set SQL_SA_PASSWORD}
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD:?Set SQL_SA_PASSWORD}
      UMBRACO_DB_NAME: ${UMBRACO_DB_NAME:-UmbracoDb}
    expose:
      - "1433"
    healthcheck:
      test: ["CMD", "bash", "/healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s
    restart: unless-stopped
    volumes:
      - sql_data:/var/opt/mssql

volumes:
  sql_data:
  umbraco_media:
