name: .NET CI/CD

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dotnet-${{ github.event.action == 'closed' && 'release' || github.ref }}
  cancel-in-progress: ${{ github.event.action != 'closed' }}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  release-plan:
    name: Plan merged-PR release
    if: github.event.action == 'closed' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}

    steps:
      - name: Check out merge commit and tags
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Decide whether and how to release
        id: plan
        shell: bash
        env:
          PR_LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          set -euo pipefail

          labels="$(jq -r '.[] | ascii_downcase' <<<"$PR_LABELS")"
          for skip_label in no-release skip-release ci chore wip; do
            if grep -Fxq "$skip_label" <<<"$labels"; then
              echo "Release suppressed by '$skip_label' label."
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done

          bump=patch
          if grep -Eqx 'release:major|semver:major|major' <<<"$labels"; then
            bump=major
          elif grep -Eqx 'release:minor|semver:minor|minor' <<<"$labels"; then
            bump=minor
          fi

          latest="$(git tag --list 'v*' --sort=-v:refname |
            grep -Em1 '^v[0-9]+\.[0-9]+\.[0-9]+$' || true)"
          current="${latest#v}"
          current="${current:-0.0.0}"
          IFS=. read -r major minor patch <<<"$current"

          case "$bump" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac

          version="$major.$minor.$patch"
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Release plan: ${latest:-none} -> v$version ($bump)"

  build-test:
    name: Discover, build and test
    if: >-
      github.event_name != 'pull_request' ||
      github.event.action != 'closed' ||
      (
        github.event.pull_request.merged == true &&
        !contains(join(github.event.pull_request.labels.*.name, ','), 'no-release') &&
        !contains(join(github.event.pull_request.labels.*.name, ','), 'skip-release') &&
        !contains(join(github.event.pull_request.labels.*.name, ','), 'ci') &&
        !contains(join(github.event.pull_request.labels.*.name, ','), 'chore') &&
        !contains(join(github.event.pull_request.labels.*.name, ','), 'wip')
      )
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      sdks: ${{ steps.discover.outputs.sdks }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merged && github.event.pull_request.merge_commit_sha || github.sha }}
          fetch-depth: 0

      - name: Discover projects and required SDKs
        id: discover
        shell: pwsh
        run: |
          $excluded = '[\\/](\.git|bin|obj|node_modules|packages|vendor|archived?|examples?|samples?)[\\/]'
          $projects = @(Get-ChildItem -Path . -Recurse -File -Filter *.csproj |
            Where-Object { $_.FullName -notmatch $excluded })

          if ($projects.Count -eq 0) {
            throw "No .NET project files were found."
          }

          $versions = [System.Collections.Generic.List[string]]::new()

          Get-ChildItem -Path . -Recurse -File -Filter global.json |
            Where-Object { $_.FullName -notmatch $excluded } |
            ForEach-Object {
              $sdk = (Get-Content $_.FullName -Raw | ConvertFrom-Json).sdk.version
              if ($sdk) {
                $versions.Add([string]$sdk)
              }
            }

          foreach ($project in $projects) {
            $content = Get-Content $project.FullName -Raw
            foreach ($match in [regex]::Matches($content, 'net(?<major>\d+)\.(?<minor>\d+)')) {
              $versions.Add("$($match.Groups['major'].Value).$($match.Groups['minor'].Value).x")
            }
          }

          $sdks = @($versions | Sort-Object -Unique)
          if ($sdks.Count -eq 0) {
            $sdks = @("latest")
          }

          "Found $($projects.Count) project(s)."
          "Installing SDK channel(s): $($sdks -join ', ')"
          "sdks<<EOF" >> $env:GITHUB_OUTPUT
          $sdks >> $env:GITHUB_OUTPUT
          "EOF" >> $env:GITHUB_OUTPUT

      - name: Set up discovered .NET SDKs
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ steps.discover.outputs.sdks }}

      - name: Resolve CI build version
        id: version
        shell: pwsh
        run: |
          $version = "0.0.0-ci.$env:GITHUB_RUN_NUMBER"
          "version=$version" >> $env:GITHUB_OUTPUT
          "Build version: $version"

      - name: Restore and build discovered targets
        shell: pwsh
        env:
          BUILD_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $excluded = '[\\/](\.git|bin|obj|node_modules|packages|vendor|archived?|examples?|samples?)[\\/]'
          $solutions = @(Get-ChildItem -Path . -Recurse -File |
            Where-Object {
              $_.Extension -in @(".sln", ".slnx") -and
              $_.FullName -notmatch $excluded
            })

          if ($solutions.Count -gt 0) {
            $targets = $solutions
          }
          else {
            $targets = @(Get-ChildItem -Path . -Recurse -File -Filter *.csproj |
              Where-Object { $_.FullName -notmatch $excluded })
          }

          foreach ($target in $targets) {
            Write-Host "::group::Restore $($target.FullName)"
            dotnet restore $target.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Write-Host "::endgroup::"

            Write-Host "::group::Build $($target.FullName)"
            dotnet build $target.FullName `
              --configuration Release `
              --no-restore `
              -p:ContinuousIntegrationBuild=true `
              -p:Version=$env:BUILD_VERSION
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Write-Host "::endgroup::"
          }

      - name: Run discovered tests
        shell: pwsh
        env:
          BUILD_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $excluded = '[\\/](\.git|bin|obj|node_modules|packages|vendor|archived?|examples?|samples?)[\\/]'
          $tests = @(Get-ChildItem -Path . -Recurse -File -Filter *.csproj |
            Where-Object { $_.FullName -notmatch $excluded } |
            Where-Object {
              $content = Get-Content $_.FullName -Raw
              $content -match '<IsTestProject>\s*true\s*</IsTestProject>' -or
              $content -match 'Microsoft\.NET\.Test\.Sdk|xunit|NUnit|MSTest'
            })

          if ($tests.Count -eq 0) {
            Write-Host "No test projects found."
          }

          foreach ($test in $tests) {
            Write-Host "::group::Test $($test.FullName)"
            dotnet test $test.FullName `
              --configuration Release `
              --verbosity normal `
              --logger "trx" `
              --results-directory "$env:RUNNER_TEMP\TestResults" `
              -p:Version=$env:BUILD_VERSION
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Write-Host "::endgroup::"
          }

      - name: Scan NuGet dependencies
        shell: pwsh
        run: |
          $excluded = '[\\/](\.git|bin|obj|node_modules|packages|vendor|archived?|examples?|samples?)[\\/]'
          $solutions = @(Get-ChildItem -Path . -Recurse -File |
            Where-Object {
              $_.Extension -in @(".sln", ".slnx") -and
              $_.FullName -notmatch $excluded
            })

          if ($solutions.Count -gt 0) {
            $targets = $solutions
          }
          else {
            $targets = @(Get-ChildItem -Path . -Recurse -File -Filter *.csproj |
              Where-Object { $_.FullName -notmatch $excluded })
          }

          $failed = $false
          foreach ($target in $targets) {
            $report = dotnet list $target.FullName package --vulnerable --include-transitive 2>&1
            $report | Write-Host
            if ($LASTEXITCODE -ne 0 -or $report -match 'has the following vulnerable packages') {
              $failed = $true
            }
          }

          if ($failed) {
            throw "One or more vulnerable NuGet dependencies were found."
          }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dotnet-test-results
          path: ${{ runner.temp }}/TestResults
          if-no-files-found: ignore
          retention-days: 14

  release:
    name: Publish merged commit
    if: needs.release-plan.outputs.publish == 'true'
    needs: [release-plan, build-test]
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Check out merged commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Set up discovered .NET SDKs
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ needs.build-test.outputs.sdks }}

      - name: Publish and package applications
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.release-plan.outputs.version }}
        run: |
          $excluded = '[\\/](\.git|bin|obj|node_modules|packages|vendor|archived?|examples?|samples?)[\\/]'
          $projects = @(Get-ChildItem -Path . -Recurse -File -Filter *.csproj |
            Where-Object { $_.FullName -notmatch $excluded } |
            Where-Object {
              $content = Get-Content $_.FullName -Raw
              $content -match '<OutputType>\s*(Exe|WinExe)\s*</OutputType>' -or
              $content -match '<Project\s+Sdk="[^"]*Microsoft\.NET\.Sdk\.(Web|Worker)'
            })

          New-Item -ItemType Directory -Path artifacts -Force | Out-Null

          foreach ($project in $projects) {
            $relative = [IO.Path]::GetRelativePath($PWD.Path, $project.FullName)
            $name = [IO.Path]::ChangeExtension($relative, $null) -replace '[\\/]', '-'
            $output = Join-Path $env:RUNNER_TEMP "publish-$name"
            $archive = Join-Path $PWD "artifacts\$name-v$env:RELEASE_VERSION.zip"

            dotnet publish $project.FullName `
              --configuration Release `
              --output $output `
              -p:ContinuousIntegrationBuild=true `
              -p:Version=$env:RELEASE_VERSION
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            Compress-Archive -Path "$output\*" -DestinationPath $archive -Force
          }

          if ($projects.Count -eq 0) {
            Write-Host "No publishable application projects were discovered; the source archives will still be released."
          }

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dotnet-${{ needs.release-plan.outputs.tag }}
          path: artifacts/*
          if-no-files-found: ignore
          retention-days: 14

      - name: Create GitHub release and version tag
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.release-plan.outputs.tag }}
          name: ${{ github.event.repository.name }} ${{ needs.release-plan.outputs.tag }}
          target_commitish: ${{ github.event.pull_request.merge_commit_sha }}
          generate_release_notes: true
          files: artifacts/*
