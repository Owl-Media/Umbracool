name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet-tests:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Umbracool.sln

      - name: Build
        run: dotnet build Umbracool.sln -c Release --no-restore

      - name: Test
        run: dotnet test Umbracool.sln -c Release --no-build --verbosity normal

  docker-validation:
    name: Validate Docker assets
    runs-on: ubuntu-latest

    env:
      SQL_SA_PASSWORD: StrongPassword123!
      UMBRACO_DB_NAME: UmbracoDb
      UMBRACO_SITE_NAME: Umbracool
      UMBRACO_ADMIN_NAME: Admin User
      UMBRACO_ADMIN_EMAIL: admin@example.com
      UMBRACO_ADMIN_PASSWORD: StrongAdminPassword123!
      UMBRACO_TELEMETRY_LEVEL: Basic

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Render Docker Compose config
        run: docker compose -f docker-compose.coolify.yml config > compose.rendered.yml

      - name: Build web image
        run: docker build -f Dockerfile .
