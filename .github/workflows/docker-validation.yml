name: Docker validation

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SQL_SA_PASSWORD: StrongPassword123!
      UMBRACO_DB_NAME: UmbracoDb
      UMBRACO_SITE_NAME: Umbracool
      UMBRACO_ADMIN_NAME: Admin User
      UMBRACO_ADMIN_EMAIL: admin@example.com
      UMBRACO_ADMIN_PASSWORD: StrongAdminPassword123!
      UMBRACO_TELEMETRY_LEVEL: Basic

    steps:
      - uses: actions/checkout@v7

      - name: Render Docker Compose configuration
        run: docker compose -f docker-compose.coolify.yml config

      - name: Build web image
        run: docker build -f Dockerfile .
